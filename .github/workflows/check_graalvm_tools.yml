name: check graalvm tools
on:
  push:
    branches:
      - master
    paths:
      - 'graalvm_tools/**'
      - '.github/workflows/check_graalvm_tools.yml'
  pull_request:
    paths:
      - 'graalvm_tools/**'
      - '.github/workflows/check_graalvm_tools.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        working-directory: graalvm_tools
        run: ./gradlew build nativeCompile
